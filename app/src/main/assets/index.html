<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epoch Love</title>
    <style>
        body { background-color: #0d0214; color: white; font-family: sans-serif; text-align: center; padding: 50px 20px; margin: 0; display: flex; flex-direction: column; justify-content: center; height: 100vh; }
        .logo { width: 150px; height: 150px; border-radius: 30px; background: linear-gradient(135deg, #ff3b7a, #7b2cbf); margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 70px; box-shadow: 0 0 30px rgba(255, 59, 122, 0.5); }
        h1 { font-size: 34px; margin: 0; color: #ff3b7a; }
        p { color: #888; letter-spacing: 2px; margin-top: 10px; font-size: 14px; }
        button { background: linear-gradient(135deg, #ff3b7a, #7b2cbf); color: white; border: none; padding: 15px 30px; border-radius: 25px; font-size: 18px; margin-top: 40px; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 59, 122, 0.4); }
        button:active { transform: scale(0.95); }
        #message { margin-top: 30px; font-size: 18px; font-weight: bold; color: #ffd700; min-height: 30px; }
    </style>
</head>
<body>
    <div class="logo">❤️</div>
    <h1>Epoch Love</h1>
    <p>FIND YOUR SOULMATE</p>
    <button onclick="findLove()">Find My Match</button>
    <div id="message"></div>

    <script>
        const messages = [
            "Your soulmate is thinking of you right now! ✨",
            "A beautiful connection is just around the corner. 💖",
            "Be patient, true love takes time. 🌹",
            "Your heart is ready for a new adventure. 💫",
            "Someone special is waiting to meet you. 💌"
        ];
        function findLove() {
            const randomIndex = Math.floor(Math.random() * messages.length);
            document.getElementById('message').innerText = messages[randomIndex];
        }
    </script>
</body>
</html>
